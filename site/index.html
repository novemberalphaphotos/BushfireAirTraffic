<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bushfire Air Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: filter + list column on the left, base and live map filling the right.
   Under 900px the two become tabs. Detail replaces the list inside the left column. */
:root {
  --bg: #eef0f2;
  --panel: #ffffff;
  --panel-2: #f5f6f8;
  --line: #d9dde2;
  --fg: #161b21;
  --muted: #5c6672;
  --accent: #c8381a;       /* fire-service red-orange */
  --accent-fg: #ffffff;
  --live: #0b8a52;
  --warn: #a86400;
  --warn-bg: #fdf1dc;
  --chip: #e6e9ed;
  --helitak: #c8381a;
  --firebird: #1c6fb8;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419; --panel: #171d24; --panel-2: #1d252e; --line: #2b3541;
    --fg: #e8ecf0; --muted: #98a3b0; --accent: #ff6a45; --accent-fg: #14100e;
    --live: #3ddc97; --warn: #f0b34d; --warn-bg: #2b2212; --chip: #26303b;
    --helitak: #ff6a45; --firebird: #5eb0f5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419; --panel: #171d24; --panel-2: #1d252e; --line: #2b3541;
  --fg: #e8ecf0; --muted: #98a3b0; --accent: #ff6a45; --accent-fg: #14100e;
  --live: #3ddc97; --warn: #f0b34d; --warn-bg: #2b2212; --chip: #26303b;
  --helitak: #ff6a45; --firebird: #5eb0f5; color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--f-body); display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
h1 { margin: 0; font: 700 24px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
h1 span { color: var(--accent); }
.stats { display: flex; gap: 18px; margin-left: auto; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; line-height: 1.1; }
.stat b { font: 600 20px/1 var(--f-display); }
.stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.stat.live b { color: var(--live); }
.iconbtn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px 10px; cursor: pointer; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(340px, 460px) 1fr; }
#side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); position: relative; }
#mapwrap { position: relative; min-height: 0; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--panel-2); }

.filters { padding: 10px 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.filters input[type=search] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.filters select { width: 100%; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tog { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); cursor: pointer; font-size: 12px; user-select: none; }
.tog input { accent-color: var(--accent); margin: 0; }
.count { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

#list { flex: 1; overflow-y: auto; min-height: 0; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; }
.item:hover, .item.sel { background: var(--panel-2); }
.cs { font: 600 19px/1.1 var(--f-display); letter-spacing: .03em; display: flex; align-items: center; gap: 8px; }
.cs i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.reg { font: 500 13px var(--f-mono); }
.sub { color: var(--muted); font-size: 12.5px; grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.sub .sep::before { content: "·"; margin-right: 6px; }
.right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.badge.live { background: var(--live); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .badge.live { color: #06140d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.live { color: #06140d; } }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; }

/* detail */
#detail { position: absolute; inset: 0; background: var(--panel); overflow-y: auto; display: none; }
#detail.open { display: block; }
.dhead { padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.dbody { padding: 14px 14px 28px; display: grid; gap: 14px; }
.photo { aspect-ratio: 3 / 2; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: grid; place-items: center; text-align: center; color: var(--muted); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs { display: flex; gap: 6px; margin-top: 6px; }
.thumbs button { border: 2px solid transparent; padding: 0; width: 64px; height: 44px; border-radius: 4px; overflow: hidden; cursor: pointer; background: none; }
.thumbs button[aria-current=true] { border-color: var(--accent); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.dtitle { font: 700 38px/1 var(--f-display); letter-spacing: .03em; margin: 0; }
dl.info { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 0; }
dl.info dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
dl.info dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel-2); }
.box.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.box h3 { margin: 0 0 6px; font: 600 12px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.livegrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-variant-numeric: tabular-nums; }
.livegrid b { display: block; font: 600 20px/1.1 var(--f-display); }
.livegrid small { color: var(--muted); font-size: 11px; }
.btn { display: inline-block; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 7px 12px; cursor: pointer; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }

/* map overlays */
.feed { position: absolute; left: 10px; bottom: 22px; z-index: 500; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; max-width: min(420px, calc(100% - 20px)); display: flex; gap: 8px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--live); } .dot.err { background: var(--accent); }
.maptools { position: absolute; right: 10px; top: 10px; z-index: 500; display: flex; flex-direction: column; gap: 6px; }
.maptools .btn { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.25); }

.bmark.multi { background: var(--accent); color: var(--accent-fg); border-color: var(--accent-fg); border-radius: 50%; }
.bmark { display: grid; place-items: center; width: 26px; height: 26px; background: var(--panel); color: var(--fg); border: 2px solid var(--fg); border-radius: 4px; font: 600 13px var(--f-display); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.acm { position: relative; }
.acm svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.acm span { position: absolute; left: 20px; top: -2px; white-space: nowrap; font: 600 12px var(--f-display); letter-spacing: .03em; background: var(--panel); color: var(--fg); padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); }
.acm.stale { opacity: .55; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--fg); }
.leaflet-popup-content { margin: 10px 12px; font: 13px/1.4 var(--f-body); }
.pop h4 { margin: 0 0 4px; font: 700 16px var(--f-display); letter-spacing: .03em; }
.pop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 2px 0; cursor: pointer; color: var(--fg); }
.pop button:hover { color: var(--accent); }
.pop .more { color: var(--muted); font-size: 12px; }

#tabs { display: none; }
@media (max-width: 899px) {
  header { gap: 8px 12px; }
  .stats { gap: 12px; }
  main { grid-template-columns: 1fr; }
  body[data-view="list"] #mapwrap { display: none; }
  body[data-view="map"] #side { display: none; }
  #side { border-right: 0; }
  #tabs { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #tabs button { border: 0; background: none; padding: 12px; font-weight: 600; cursor: pointer; border-top: 3px solid transparent; }
  #tabs button[aria-selected=true] { border-top-color: var(--accent); color: var(--accent); }
  dl.info { grid-template-columns: 90px 1fr; }
  .livegrid { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .dot.ok { animation: pulse 2s infinite; } }
@keyframes pulse { 50% { opacity: .45; } }
</style>
</head>
<body data-view="list">
<header>
  <h1>Bushfire <span>Air</span> Tracker</h1>
  <div class="stats" aria-live="polite">
    <div class="stat"><b id="sTotal">0</b><small>Aircraft</small></div>
    <div class="stat"><b id="sBased">0</b><small>Base known</small></div>
    <div class="stat live"><b id="sLive">0</b><small>Live now</small></div>
  </div>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch light or dark theme">Theme</button>
</header>

<main>
  <section id="side" aria-label="Fleet list">
    <div class="filters">
      <input type="search" id="q" placeholder="Search rego, callsign, type, operator, base" autocomplete="off" aria-label="Search">
      <div class="row2">
        <select id="fGroup" aria-label="Callsign group"><option value="">All callsigns</option></select>
        <select id="fFamily" aria-label="Aircraft type"><option value="">All types</option></select>
      </div>
      <div class="row2">
        <select id="fOp" aria-label="Operator"><option value="">All operators</option></select>
        <select id="fState" aria-label="Base state"><option value="">All states</option></select>
      </div>
      <div class="toggles">
        <label class="tog"><input type="checkbox" id="tLive"> Live now</label>
        <label class="tog"><input type="checkbox" id="tBase"> Base known</label>
        <label class="tog" id="tDiffWrap" hidden><input type="checkbox" id="tDiff"> Differs from NAFC</label>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div id="list" role="list"></div>
    <article id="detail" aria-label="Aircraft detail"></article>
  </section>
  <section id="mapwrap" aria-label="Map">
    <div id="map"></div>
    <div class="maptools">
      <button class="btn" id="fitLive" type="button">Fit live</button>
      <button class="btn" id="fitAll" type="button">Fit Australia</button>
    </div>
    <div class="feed"><i class="dot" id="feedDot"></i><span id="feedText">Starting live feed…</span></div>
  </section>
</main>
<nav id="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-v="list" type="button">Fleet</button>
  <button role="tab" aria-selected="false" data-v="map" type="button">Map</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* ---------- settings you may want to change ---------- */
const REFRESH_SECONDS = 20;       // live feed refresh
const CHUNK = 100;                // registrations per feed request
const STALE_AFTER = 120;          // seconds since last position before a marker fades
const DROP_AFTER = 900;           // seconds since last position before it is hidden
const PROVIDERS = [               // tried in order; each is a community ADS-B API
  { name: "airplanes.live", url: regs => `https://api.airplanes.live/v2/reg/${regs}` },
  { name: "adsb.lol",       url: regs => `https://api.adsb.lol/v2/reg/${regs}` },
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const natural = (a, b) => a.localeCompare(b, "en", { numeric: true });
const groupColor = g => g === "FIREBIRD" ? "var(--firebird)" : "var(--helitak)";

let fleet = [];            // all aircraft
let live = new Map();      // REGO -> live record
let nafc = null;           // Map REGO -> [callsigns], when data/nafc_callsigns.json exists
let selected = null;       // aircraft entry shown in detail
const f = { q: "", group: "", family: "", op: "", state: "", live: false, base: false, diff: false };

/* ---------- theme ---------- */
function theme() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function setTheme(t) { document.documentElement.dataset.theme = t; store.set("theme", t); applyTiles(); }
{ const t = store.get("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; }
$("themeBtn").onclick = () => setTheme(theme() === "dark" ? "light" : "dark");

/* ---------- map ---------- */
const map = L.map("map", { zoomControl: true, preferCanvas: false }).setView([-33.5, 146.5], 5);
let tiles;
function applyTiles() {
  if (tiles) map.removeLayer(tiles);
  const style = theme() === "dark" ? "dark_all" : "light_all";
  tiles = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${style}/{z}/{x}/{y}{r}.png`, {
    subdomains: "abcd", maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);
}
applyTiles();
const baseLayer = L.layerGroup().addTo(map);
const liveLayer = L.layerGroup().addTo(map);

let baseGroups = [];
function drawBases(list) {
  const byBase = new Map();
  for (const a of list) if (a.base) {
    const k = a.base.name + "|" + a.base.state;
    if (!byBase.has(k)) byBase.set(k, { b: a.base, items: [] });
    byBase.get(k).items.push(a);
  }
  baseGroups = [...byBase.values()].sort((x, y) => y.items.length - x.items.length);
  renderBases();
}
// Nearby bases merge into one numbered marker at low zoom; click it to zoom in.
function renderBases() {
  baseLayer.clearLayers();
  const clusters = [];
  for (const g of baseGroups) {
    const pt = map.latLngToLayerPoint([g.b.lat, g.b.lon]);
    const c = clusters.find(c => c.pt.distanceTo(pt) < 30);
    if (c) { c.groups.push(g); c.count += g.items.length; } else clusters.push({ pt, groups: [g], count: g.items.length });
  }
  for (const c of clusters) {
    const first = c.groups[0].b;
    const many = c.groups.length > 1;
    const icon = L.divIcon({ className: "", html: `<div class="bmark${many ? " multi" : ""}">${c.count}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
    const m = L.marker([first.lat, first.lon], { icon, title: many ? `${c.groups.length} bases` : first.name }).addTo(baseLayer);
    if (many) {
      m.on("click", () => map.fitBounds(c.groups.map(g => [g.b.lat, g.b.lon]), { padding: [60, 60], maxZoom: 12 }));
      continue;
    }
    const { b, items } = c.groups[0];
    const shown = items.slice().sort((x, y) => natural(x.callsign, y.callsign));
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.innerHTML = `<h4>${esc(b.name)}, ${esc(b.state)}</h4><div class="more">${items.length} aircraft based here</div>`;
    for (const a of shown.slice(0, 14)) {
      const bt = document.createElement("button");
      bt.type = "button";
      bt.textContent = `${a.callsign}  ·  ${a.rego}  ·  ${a.type}`;
      bt.onclick = () => openDetail(a);
      pop.appendChild(bt);
    }
    if (shown.length > 14) pop.insertAdjacentHTML("beforeend", `<div class="more">+${shown.length - 14} more, search the list</div>`);
    m.bindPopup(pop);
  }
}
map.on("zoomend", renderBases);

function planeSvg(color, track) {
  return `<svg width="22" height="22" viewBox="0 0 22 22" style="transform:rotate(${track || 0}deg)"><path d="M11 1.5 L16.5 18 L11 15 L5.5 18 Z" fill="${color}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
function resolveColor(g) { return getComputedStyle(document.documentElement).getPropertyValue(g === "FIREBIRD" ? "--firebird" : "--helitak").trim(); }

function drawLive() {
  liveLayer.clearLayers();
  const byReg = new Map();
  for (const a of visible()) byReg.set(a.rego, [...(byReg.get(a.rego) || []), a]);
  for (const [reg, items] of byReg) {
    const p = live.get(reg);
    if (!p) continue;
    const stale = p.age > STALE_AFTER;
    const label = items.map(a => a.callsign).join(" / ");
    const icon = L.divIcon({ className: "", html: `<div class="acm${stale ? " stale" : ""}">${planeSvg(resolveColor(items[0].group), p.track)}<span>${esc(label)}</span></div>`, iconSize: [22, 22], iconAnchor: [11, 11] });
    const m = L.marker([p.lat, p.lon], { icon, zIndexOffset: 1000 }).addTo(liveLayer);
    m.on("click", () => openDetail(items[0]));
    m.bindTooltip(`${reg} · ${fmtAlt(p)} · ${p.gs != null ? Math.round(p.gs) + " kt" : "no speed"}`, { direction: "top", offset: [0, -8] });
  }
}
const fmtAlt = p => p.alt === "ground" ? "on ground" : (typeof p.alt === "number" ? p.alt.toLocaleString("en-AU") + " ft" : "alt unknown");
const fmtAge = s => s < 90 ? `${Math.round(s)} s ago` : `${Math.round(s / 60)} min ago`;

$("fitLive").onclick = () => {
  const pts = [...live.values()].map(p => [p.lat, p.lon]);
  if (pts.length) map.fitBounds(pts, { padding: [50, 50], maxZoom: 11 });
};
$("fitAll").onclick = () => map.setView([-33.5, 146.5], 5);

/* ---------- live feed ---------- */
let providerIdx = 0, feedTimer = null, lastOk = 0;
function setFeed(kind, text) { $("feedDot").className = "dot " + kind; $("feedText").textContent = text; }

async function fetchChunk(regs) {
  let lastErr;
  for (let i = 0; i < PROVIDERS.length; i++) {
    const pv = PROVIDERS[(providerIdx + i) % PROVIDERS.length];
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 12000);
      const r = await fetch(pv.url(regs.join(",")), { signal: ctl.signal, cache: "no-store" });
      clearTimeout(to);
      if (!r.ok) throw new Error(`${pv.name} HTTP ${r.status}`);
      const j = await r.json();
      if (!Array.isArray(j.ac)) throw new Error(`${pv.name}: unexpected reply`);
      providerIdx = (providerIdx + i) % PROVIDERS.length;
      return { name: pv.name, ac: j.ac };
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

async function pollLive() {
  clearTimeout(feedTimer);
  if (document.hidden || !fleet.length) { feedTimer = setTimeout(pollLive, 3000); return; }
  const regs = [...new Set(fleet.map(a => a.rego))];
  const next = new Map(); let used = "", failed = 0;
  for (let i = 0; i < regs.length; i += CHUNK) {
    try {
      const { name, ac } = await fetchChunk(regs.slice(i, i + CHUNK));
      used = name;
      for (const p of ac) {
        const reg = (p.r || "").toUpperCase();
        if (!reg || typeof p.lat !== "number" || typeof p.lon !== "number") continue;
        const age = typeof p.seen_pos === "number" ? p.seen_pos : (typeof p.seen === "number" ? p.seen : 0);
        if (age > DROP_AFTER) continue;
        next.set(reg, { lat: p.lat, lon: p.lon, track: p.track ?? p.true_heading ?? 0, gs: p.gs, alt: p.alt_baro, hex: p.hex, flight: (p.flight || "").trim(), age, t: Date.now() });
      }
    } catch (e) { failed++; console.warn("Live feed error", e); }
    if (i + CHUNK < regs.length) await new Promise(r => setTimeout(r, 1100)); // stay under 1 request/second
  }
  const total = Math.ceil(regs.length / CHUNK);
  if (failed < total) {
    live = next; lastOk = Date.now();
    setFeed("ok", `${used}: ${live.size} of ${regs.length} registrations transmitting` + (failed ? ` (${failed} request${failed > 1 ? "s" : ""} failed)` : ""));
  } else {
    setFeed("err", `Live feed unreachable. Showing ${live.size ? "last known positions" : "bases only"}. Retrying.`);
  }
  $("sLive").textContent = live.size;
  render(false); drawLive(); if (selected) renderDetail();
  feedTimer = setTimeout(pollLive, REFRESH_SECONDS * 1000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastOk > REFRESH_SECONDS * 1000) pollLive(); });

/* ---------- filtering and list ---------- */
function visible() {
  const q = f.q.trim().toLowerCase();
  return fleet.filter(a => {
    if (f.group && a.group !== f.group) return false;
    if (f.family && a.family !== f.family) return false;
    if (f.op && a.operator !== f.op) return false;
    if (f.state && (a.base?.state) !== f.state) return false;
    if (f.live && !live.has(a.rego)) return false;
    if (f.base && !a.base) return false;
    if (f.diff && !differs(a)) return false;
    if (q && !a._hay.includes(q)) return false;
    return true;
  });
}
function differs(a) {
  if (!nafc) return false;
  const cs = nafc.get(a.rego);
  return !cs || !cs.includes(a.callsign);
}

function render(redrawMap = true) {
  const rows = visible().sort((a, b) => natural(a.callsign, b.callsign));
  $("count").textContent = `${rows.length} of ${fleet.length}`;
  const list = $("list");
  if (!rows.length) { list.innerHTML = `<div class="empty">No aircraft match these filters.</div>`; }
  else {
    list.innerHTML = rows.map(a => {
      const l = live.get(a.rego);
      const base = a.base ? `${esc(a.base.name)}, ${esc(a.base.state)}` : "Base not confirmed";
      return `<button type="button" class="item${selected === a ? " sel" : ""}" data-id="${fleet.indexOf(a)}" role="listitem">
        <div><div class="cs"><i style="background:${groupColor(a.group)}"></i>${esc(a.callsign)}</div></div>
        <div class="right">${l ? `<span class="badge live">LIVE</span>` : ""}${differs(a) ? `<span class="badge warn">NAFC differs</span>` : ""}</div>
        <div class="sub"><span class="reg">${esc(a.rego)}</span><span class="sep">${esc(a.type)}</span><span class="sep">${esc(a.operator || "Operator unknown")}</span></div>
        <div class="sub">${base}</div>
      </button>`;
    }).join("");
  }
  if (redrawMap) { drawBases(rows); drawLive(); }
}
$("list").addEventListener("click", e => {
  const b = e.target.closest(".item"); if (b) openDetail(fleet[+b.dataset.id]);
});

function fillSelect(id, values, label) {
  const el = $(id);
  el.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option>${esc(v)}</option>`).join("");
}
function uniq(key) {
  const c = new Map();
  for (const a of fleet) { const v = typeof key === "function" ? key(a) : a[key]; if (v) c.set(v, (c.get(v) || 0) + 1); }
  return [...c.keys()].sort(natural);
}
function bindFilter(id, key, evt = "input") {
  $(id).addEventListener(evt, e => { f[key] = e.target.type === "checkbox" ? e.target.checked : e.target.value; closeDetail(); render(); });
}
bindFilter("q", "q"); bindFilter("fGroup", "group", "change"); bindFilter("fFamily", "family", "change");
bindFilter("fOp", "op", "change"); bindFilter("fState", "state", "change");
bindFilter("tLive", "live", "change"); bindFilter("tBase", "base", "change"); bindFilter("tDiff", "diff", "change");

/* ---------- detail ---------- */
let photoIdx = 0;
function openDetail(a) {
  selected = a; photoIdx = 0; renderDetail();
  $("detail").classList.add("open"); $("detail").scrollTop = 0;
  document.body.dataset.view = "list"; syncTabs();
  document.querySelectorAll(".item.sel").forEach(n => n.classList.remove("sel"));
  const l = live.get(a.rego);
  if (l) map.flyTo([l.lat, l.lon], Math.max(map.getZoom(), 9), { duration: .6 });
  else if (a.base) map.flyTo([a.base.lat, a.base.lon], Math.max(map.getZoom(), 8), { duration: .6 });
}
function closeDetail() { selected = null; $("detail").classList.remove("open"); }

function renderDetail() {
  const a = selected; if (!a) return;
  const l = live.get(a.rego);
  const ph = a.photos[photoIdx];
  const reg = encodeURIComponent(a.rego);
  const nafcCs = nafc?.get(a.rego);
  let nafcMsg = "";
  if (nafc) {
    if (!nafcCs) nafcMsg = `<div class="box warn">${esc(a.rego)} is not on the current NAFC call sign list.</div>`;
    else if (!nafcCs.includes(a.callsign)) nafcMsg = `<div class="box warn">NAFC list shows <b>${esc(nafcCs.join(", "))}</b> for ${esc(a.rego)}. Your spreadsheet has ${esc(a.callsign)}.</div>`;
  }
  $("detail").innerHTML = `
    <div class="dhead"><button class="btn" type="button" id="back">&larr; List</button><span class="badge">${esc(a.group)}</span></div>
    <div class="dbody">
      <div>
        <h2 class="dtitle">${esc(a.callsign)}</h2>
        <div class="reg" style="font-size:16px">${esc(a.rego)}</div>
      </div>
      <div>
        <div class="photo">${ph ? `<img src="${esc(ph)}" alt="${esc(a.rego)} ${esc(a.type)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'Photo not found: ${esc(ph)}'}))">`
          : `<div style="padding:16px">No photo yet.<br><small>Save one as <span class="reg">photos/${esc(a.rego)}.jpg</span></small></div>`}</div>
        ${a.photos.length > 1 ? `<div class="thumbs">${a.photos.map((p, i) => `<button type="button" data-i="${i}" aria-current="${i === photoIdx}" aria-label="Photo ${i + 1}"><img src="${esc(p)}" alt=""></button>`).join("")}</div>` : ""}
      </div>
      ${l ? `<div class="box"><h3>Live position · ${fmtAge(l.age)}</h3>
        <div class="livegrid"><div><b>${esc(fmtAlt(l))}</b><small>Altitude</small></div><div><b>${l.gs != null ? Math.round(l.gs) + " kt" : "-"}</b><small>Ground speed</small></div><div><b>${Math.round(l.track || 0)}°</b><small>Track</small></div><div><b class="reg">${esc((l.hex || "").toUpperCase())}</b><small>Mode S hex</small></div></div>
        <p style="margin:8px 0 0"><button class="btn primary" type="button" id="goLive">Show on map</button></p></div>`
        : `<div class="box"><h3>Live position</h3>No ADS-B position right now. Many fire helicopters only transmit while flying, and some have no ADS-B at all.</div>`}
      ${nafcMsg}
      <dl class="info">
        <dt>Type</dt><dd>${esc(a.type)} <span class="badge">${esc(a.family)}</span></dd>
        <dt>Operator</dt><dd>${esc(a.operator || "Not confirmed")}</dd>
        <dt>Base</dt><dd>${a.base ? `${esc(a.base.name)}, ${esc(a.base.state)}` : esc(a.baseText || "Not confirmed")}</dd>
        ${a.note ? `<dt>Note</dt><dd>${esc(a.note)}</dd>` : ""}
      </dl>
      <div class="links">
        ${a.base ? `<button class="btn" type="button" id="goBase">View base on map</button>` : ""}
        <a class="btn" target="_blank" rel="noopener" href="https://globe.adsbexchange.com/?reg=${reg}">ADSBexchange</a>
        <a class="btn" target="_blank" rel="noopener" href="https://www.planespotters.net/search?q=${reg}">Planespotters</a>
        <a class="btn" target="_blank" rel="noopener" href="https://www.jetphotos.com/registration/${reg}">JetPhotos</a>
      </div>
    </div>`;
  $("back").onclick = () => { closeDetail(); render(false); };
  $("goLive")?.addEventListener("click", () => { document.body.dataset.view = "map"; syncTabs(); setTimeout(() => { map.invalidateSize(); map.flyTo([l.lat, l.lon], 11); }, 50); });
  $("goBase")?.addEventListener("click", () => { document.body.dataset.view = "map"; syncTabs(); setTimeout(() => { map.invalidateSize(); map.flyTo([a.base.lat, a.base.lon], 11); }, 50); });
  $("detail").querySelectorAll(".thumbs button").forEach(b => b.onclick = () => { photoIdx = +b.dataset.i; renderDetail(); });
}

/* ---------- tabs (phone) ---------- */
function syncTabs() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === document.body.dataset.view));
  if (document.body.dataset.view === "map") setTimeout(() => { map.invalidateSize(); if (!fitted) fitBases(); }, 50);
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { document.body.dataset.view = b.dataset.v; syncTabs(); });

/* ---------- start ---------- */
let fitted = false;
function fitBases() {
  const size = map.getSize();
  if (size.x < 50) return;            // map is hidden (phone, list tab): fit when it is first shown
  const based = fleet.filter(a => a.base).map(a => [a.base.lat, a.base.lon]);
  if (based.length) map.fitBounds(based, { padding: [30, 30] });
  fitted = true;
}
async function loadJson(path) { const r = await fetch(path, { cache: "no-cache" }); if (!r.ok) throw new Error(path + " " + r.status); return r.json(); }
(async function init() {
  try { fleet = await loadJson("data/aircraft.json"); }
  catch (e) { $("list").innerHTML = `<div class="empty">Could not load data/aircraft.json.<br>If you opened index.html straight from disk, serve the folder instead: <span class="reg">python3 -m http.server</span></div>`; return; }
  for (const a of fleet) a._hay = [a.rego, a.callsign, a.type, a.family, a.operator, a.base?.name, a.base?.state, a.baseText, a.note].join(" ").toLowerCase();
  try {
    const n = await loadJson("data/nafc_callsigns.json");
    nafc = new Map();
    for (const e of n.entries) nafc.set(e.registration, [...(nafc.get(e.registration) || []), e.callsign]);
    $("tDiffWrap").hidden = false;
  } catch { /* the alert job has not produced it yet */ }
  fillSelect("fGroup", uniq("group"), "All callsigns");
  fillSelect("fFamily", uniq("family"), "All types");
  fillSelect("fOp", uniq("operator"), "All operators");
  fillSelect("fState", uniq(a => a.base?.state), "All states");
  $("sTotal").textContent = fleet.length;
  $("sBased").textContent = fleet.filter(a => a.base).length;
  render();
  fitBases();
  pollLive();
})();
</script>
</body>
</html>
