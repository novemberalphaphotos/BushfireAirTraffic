name: Update data and watch NAFC call signs

# Rebuilds site/data/aircraft.json from the spreadsheet (resolving the Google Maps pins),
# checks the NAFC call sign list, and saves the results back to the repository.
# Cloudflare Pages publishes the site whenever the repository changes.

on:
  push:
    branches: [main]
    paths: ["data/**", "site/photos/**", "scripts/**", ".github/workflows/**"]
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours at 17 past (UTC)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install spreadsheet reader
        run: pip install openpyxl

      - name: Rebuild aircraft data from the spreadsheet
        continue-on-error: true
        run: python3 scripts/build_data.py

      - name: Check NAFC call sign list
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 scripts/check_callsigns.py

      - name: Save results
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data data/maps_cache.json
          git diff --cached --quiet || (git commit -m "Update aircraft data and NAFC snapshot" && git pull --rebase && git push)
